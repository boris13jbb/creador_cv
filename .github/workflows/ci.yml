name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter format · analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin para alinear dart format con el entorno de desarrollo (evita
          # falso rojo por reglas de formato entre stables).
          channel: stable
          flutter-version: "3.44.2"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format check
        # lib/test = app principal. super_admin se formateará al integrar su WIP (Fase 2).
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage (lcov only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  functions:
    name: Cloud Functions build · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  # No sube APK/AAB firmados ni secretos. Solo valida que el árbol compile.
  build-web:
    name: Build web (smoke)
    runs-on: ubuntu-latest
    needs: [flutter]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.2"
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload web build (sin .env / secretos)
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          retention-days: 7
          # Excluye por si alguien deja archivos sensibles en web/
          # (el build Flutter no incluye .env del repo raíz)
