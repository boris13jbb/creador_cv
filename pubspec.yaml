name: creador_cv
description: "CV Maker — crea, gestiona y exporta currículums profesionales en PDF."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  universal_io: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  intl: ^0.20.2
  image_picker: ^1.0.7
  uuid: ^4.3.3
  path: ^1.9.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.1.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  image: ^4.9.1
  google_fonts: ^8.2.1
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/privacy_es.md
    - assets/legal/terms_es.md
